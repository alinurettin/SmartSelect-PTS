<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SmartSelect-PTS - Predictive Test Selection Console</title>
  <style>
    body { background: #0b0f19; color: #e2e8f0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 24px; }
    .card { background: #151d30; border: 1px solid #233252; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
    h1 { color: #38bdf8; margin: 0 0 10px 0; font-size: 24px; }
    .badge { background: #0284c7; color: white; padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-right: 8px; }
    button { background: #0284c7; border: none; color: white; padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    pre { background: #070b14; border: 1px solid #1e293b; padding: 16px; border-radius: 6px; color: #a5f3fc; overflow-x: auto; }
  </style>
</head>
<body>
  <div class="card">
    <h1>🎯 SmartSelect-PTS</h1>
    <p><span class="badge">Predictive Test Selection</span> <span class="badge">Call-Graph Diff</span> <span class="badge">Port 7069</span></p>
    <p>Predictive Test Selection & Bayesian Flaky Test Triage Engine.</p>
    <button onclick="runPTSDemo()">⚡ Execute AST Predictive Test Selection</button>
  </div>
  <div class="card">
    <h3>📊 Selected Test Subset & CI/CD Savings</h3>
    <pre id="output">Click 'Execute AST Predictive Test Selection' to analyze test coverage matrix...</pre>
  </div>
  <script>
    async function runPTSDemo() {
      document.getElementById('output').textContent = 'Analyzing Git AST diff against runtime call-graph...';
      const res = await fetch('/api/select', { method: 'POST' });
      const data = await res.json();
      document.getElementById('output').textContent = JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
